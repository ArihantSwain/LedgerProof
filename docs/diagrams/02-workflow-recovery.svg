<text x="570" y="570" fill="#6c7c76" font-family="Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0">supported proposal</text>
<rect x="770" y="620" width="290" height="120" rx="12" fill="#eaf3eb" stroke="#36725a" stroke-width="1.5"/>
<text x="788" y="650" fill="#223b35" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0">Atomic commit</text>
<text x="788" y="677" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">Entry + decision + event</text>
<text x="788" y="699" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">Recompute revised cash</text>
<text x="788" y="724" fill="#36725a" font-family="Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1">POST ONCE</text>
<polyline points="700,680 770,680" fill="none" stroke="#7d9185" stroke-width="1.7"  marker-end="url(#arrow)"/>
<rect x="50" y="620" width="290" height="120" rx="12" fill="#fff2e8" stroke="#b07845" stroke-width="1.5"/>
<text x="68" y="650" fill="#223b35" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0">Needs review / retry</text>
<text x="68" y="677" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">Malformed result → review</text>
<text x="68" y="699" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">Retrieval outage → same ID</text>
<text x="68" y="724" fill="#b07845" font-family="Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1">NO FABRICATED FALLBACK</text>
<polyline points="410,465 365,465 365,580 195,580 195,620" fill="none" stroke="#7d9185" stroke-width="1.7"  marker-end="url(#arrow)"/>
<rect x="410" y="820" width="650" height="95" rx="12" fill="#ffffff" stroke="#cbd7d0" stroke-width="1.5"/>
<text x="428" y="850" fill="#223b35" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0">Stale input or reset generation</text>
<text x="428" y="877" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">Late old output cannot replace the current workspace; completed decisions retain their source trail.</text>
<line x1="50" y1="953" x2="1350" y2="953" stroke="#dbe3dc"/>
<text x="50" y="975" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">Local concurrent/idempotent decisions are tested. Native Convex Workflow, scheduled retrieval, and automatic model-output repair remain future work.</text>
