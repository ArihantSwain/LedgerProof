<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010" role="img" aria-labelledby="title desc">
<title id="title">Investigation, review, and recovery</title><desc id="desc">Implemented transitions are shown; provider execution is still blocked. Unknown submission is never blindly repeated.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d9185"/></marker></defs>
<rect width="1400" height="1010" fill="#f8faf6"/>
<text x="50" y="46" fill="#6c7c76" font-family="Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2">LEDGERPROOF / ARCHITECTURE ATLAS</text>
<text x="50" y="90" fill="#223b35" font-family="Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0">Investigation, review, and recovery</text>
<text x="50" y="121" fill="#6c7c76" font-family="Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0">Implemented transitions are shown; provider execution is still blocked. Unknown submission is never blindly repeated.</text>
<rect x="50" y="180" width="290" height="110" rx="12" fill="#eaf3eb" stroke="#36725a" stroke-width="1.5"/>
<text x="68" y="210" fill="#223b35" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0">Evidence changes</text>
<text x="68" y="237" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">Increment inputVersion</text>
<text x="68" y="259" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">Discard pending stale findings</text>
<text x="68" y="274" fill="#36725a" font-family="Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1">SOURCE BOUNDARY</text>
<rect x="410" y="180" width="290" height="110" rx="12" fill="#eaf3eb" stroke="#36725a" stroke-width="1.5"/>
<text x="428" y="210" fill="#223b35" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0">Start investigation</text>
<text x="428" y="237" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">Save local run + generation</text>
<text x="428" y="259" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">CREAO or labeled rehearsal</text>
<text x="428" y="274" fill="#36725a" font-family="Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1">QUEUED</text>
<rect x="770" y="180" width="290" height="110" rx="12" fill="#eaf3eb" stroke="#36725a" stroke-width="1.5"/>
<text x="788" y="210" fill="#223b35" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0">Persist submission intent</text>
<text x="788" y="237" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">Before outbound network call</text>
<text x="788" y="259" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">No assumed idempotency</text>
<text x="788" y="274" fill="#36725a" font-family="Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1">UNKNOWN UNTIL ID SAVED</text>
