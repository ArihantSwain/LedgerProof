<text x="788" y="447" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">Retrieve same run after retry</text>
<text x="788" y="469" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">pending / running / terminal</text>
<text x="788" y="494" fill="#b07845" font-family="Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1">SUBMITTED → RUNNING</text>
