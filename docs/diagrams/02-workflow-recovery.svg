<text x="68" y="447" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">Reconcile account history</text>
<text x="68" y="469" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">Do not create another run</text>
<text x="68" y="494" fill="#b07845" font-family="Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1">MANUAL RECONCILIATION</text>
