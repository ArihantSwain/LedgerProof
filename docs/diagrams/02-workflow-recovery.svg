<text x="360" y="339" fill="#6c7c76" font-family="Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0">timeout before saved ID</text>
<rect x="410" y="390" width="290" height="120" rx="12" fill="#eaf3eb" stroke="#36725a" stroke-width="1.5"/>
<text x="428" y="420" fill="#223b35" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0">Validation gate</text>
<text x="428" y="447" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">Version / schema / evidence</text>
<text x="428" y="469" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">Reject wrong provider run ID</text>
<text x="428" y="494" fill="#36725a" font-family="Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1">NO FACTS INVENTED</text>
<polyline points="770,450 700,450" fill="none" stroke="#7d9185" stroke-width="1.7" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="710" y="435" fill="#6c7c76" font-family="Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0">result</text>
<rect x="410" y="620" width="290" height="120" rx="12" fill="#eaf3eb" stroke="#36725a" stroke-width="1.5"/>
<text x="428" y="650" fill="#223b35" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0">Reviewer decision</text>
<text x="428" y="677" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">Inspect source + enter reason</text>
<text x="428" y="699" fill="#6c7c76" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">CAS version + request key</text>
<text x="428" y="724" fill="#36725a" font-family="Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1">HUMAN APPROVAL REQUIRED</text>
